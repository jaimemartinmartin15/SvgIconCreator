<div class="header">
  <span class="app-control-label">ESTRUCTURA SVG</span>

  <div class="buttons-container">
    <button (click)="newGroup()">Nuevo grupo</button>

    <button (click)="duplicateShape()">Duplicar</button>
  </div>
</div>

<ul id="main-cdk-drop-list" cdkDropList [cdkDropListData]="shapes" (cdkDropListDropped)="onDroppedListElement($event)" [cdkDropListConnectedTo]="cdkListIds">
  @for (shape of shapes; track shape) {
    @if (shapeIsGroup(shape)) {
      <li cdkDrag>
        <app-shape-group [groupHost]="shape" (openBindingsDialog)="openBindingsDialog.next()"></app-shape-group>
      </li>
    } @else {
      <li cdkDrag>
        <app-shape-element [shapeHost]="shape" (openBindingsDialog)="openBindingsDialog.next()"></app-shape-element>
      </li>
    }
  }
</ul>
