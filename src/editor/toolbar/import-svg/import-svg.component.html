<button class="open-dialog-button" (click)="showDialog()">
  <svg appImportSvg></svg>
</button>

<span class="app-control-label">IMPORTAR</span>

<dialog class="dialog" #importSvgDialog cdkDrag>
  <div class="content">
    <div class="header">
      <svg appBurgerSvg color="black" class="drag-dialog-handler" cdkDragHandle></svg>
      <span class="title">IMPORTAR</span>
      <svg appPlusSvg class="close-dialog-button" (click)="importSvgDialog.close()"></svg>
    </div>

    <form>
      <div class="app-label-and-input texto-svg">
        <span class="app-control-label">TEXTO SVG</span>

        <textarea #textArea></textarea>

        <button type="button" class="load-button" (click)="loadSvgText(textArea.value)">Cargar</button>
      </div>

      <div class="app-label-and-input file-svg">
        <span class="app-control-label">FICHERO SVG</span>

        <label>
          <input type="file" accept=".svg,.txt" (change)="loadFile($event)" />
          <div class="mock-input-file">{{ loadedFile ? loadedFile.name : 'Cargar un fichero' }}</div>
        </label>
      </div>

      <div class="app-label-and-input create-new-group">
        <span class="app-control-label">CREATE NEW GROUP</span>

        <span class="info-message">Al cargar el texto o el fichero, las figuras se añadirán a un grupo nuevo en lugar de la raíz del svg.</span>

        <label class="mock-input-checkbox">
          <input type="checkbox" [formControl]="createNewGroupForm" />
        </label>
      </div>
    </form>
  </div>
</dialog>
